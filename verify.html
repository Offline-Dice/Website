.section-label{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 9px 2px;
  font-size:17px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 2px 1px rgba(28,111,179,.4);
}

.input-row{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

input{
  flex:1;
  min-width:0;
  height:64px;
  padding:0 20px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#2165b5;
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 4px 0 rgba(29,111,180,.18);
}

input::placeholder{color:#83a7c9}
input:focus{
  outline:3px solid rgba(255,255,255,.55);
  box-shadow:0 5px 0 rgba(29,111,180,.18);
}

button{
  width:152px;
  height:64px;
  border:0;
  border-radius:13px;
  background:#ffd21a;
  color:#fff;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  text-shadow:0 2px 0 #b88e00;
  box-shadow:0 5px 0 #c89e00;
  transition:transform .15s,filter .15s;
}

button:hover{filter:brightness(1.04);transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #c89e00}
button.loading{opacity:.9;pointer-events:none}

.panel{
  background:#fff;
  color:#1d61aa;
  border-radius:13px;
  box-shadow:0 5px 0 rgba(29,111,180,.18);
  margin-bottom:18px;
  overflow:hidden;
}

.panel-title{
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:9px 15px;
  font-size:16px;
  font-weight:900;
  letter-spacing:1.5px;
}

.result-panel{
  text-align:center;
  padding:0 16px 14px;
}

#result{
  color:#1d61aa;
  min-height:20px;
}

#result:empty{display:none}

.status{
  margin:0 0 9px;
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.result-id{
  margin:0 0 10px;
  color:#6b86a0;
  font-size:13px;
  font-weight:700;
}

.dice-row{
  display:flex;
  justify-content:center;
  gap:10px;
  min-height:64px;
  align-items:center;
}

.die{
  width:68px;
  height:68px;
  border:3px solid #fff;
  border-radius:13px;
  box-shadow:0 3px 7px rgba(0,0,0,.22);
  display:grid;
  place-items:center;
  opacity:0;
  animation:diceReveal .45s forwards;
}

.die:after{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
}

.result-time{
  margin:9px 0 0;
  color:#6c849c;
  font-size:13px;
  font-weight:700;
  text-align:center;
}

.warning{
  display:none;
  background:#fff;
  color:#e21d1d;
  border-radius:13px;
  padding:16px 18px;
  margin-bottom:18px;
  text-align:center;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
  box-shadow:0 5px 0 rgba(29,111,180,.18);
}

.roll-list{
  padding:0 12px 7px;
}

.roll-item{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:8px;
  align-items:center;
  min-height:55px;
  margin-bottom:7px;
  padding:7px 9px;
  border-radius:11px;
  background:#eaf6ff;
  color:#2b6eaf;
}

.roll-number{
  font-size:17px;
  font-weight:900;
  text-align:center;
}

.mini-dice{
  display:flex;
  gap:5px;
  align-items:center;
}

.mini-die{
  width:29px;
  height:29px;
  border:2px solid #fff;
  border-radius:6px;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
  position:relative;
}

.mini-die:after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.roll-time{
  color:#718ba3;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.empty-rolls{
  padding:18px 10px;
  text-align:center;
  color:#7b96ad;
  font-size:13px;
  font-weight:700;
}

.error{
  color:#df2525!important;
}

.back{
  display:block;
  width:max-content;
  margin:22px auto 0;
  color:#ffd21a;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
  text-shadow:0 2px 0 rgba(120,90,0,.25);
}

.back:hover{text-decoration:underline}

@keyframes diceReveal{
  0%{opacity:0;transform:translateY(18px) scale(.65) rotate(-18deg)}
  70%{opacity:1;transform:translateY(-4px) scale(1.08) rotate(5deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

@media(max-width:520px){
  body{padding:22px 11px 30px}
  h1{font-size:35px}
  .input-row{gap:7px}
  input{height:58px;font-size:17px;padding:0 14px}
  button{width:125px;height:58px;font-size:15px}
  .die{width:56px;height:56px}
  .roll-item{grid-template-columns:28px 1fr}
  .roll-time{grid-column:2;justify-self:start}
}
</style>
</head>

<body>
<main class="page">
  <header class="header">
    <div class="shield">🛡️</div>
    <h1>VERIFY</h1>
  </header>

  <div class="section-label">🎲 GAME ID:</div>
  <div class="input-row">
    <input id="code" placeholder="KZ-XXXXXX" autocomplete="off">
    <button id="verifyBtn" onclick="verify()">VERIFY</button>
  </div>

  <section class="panel">
    <div class="panel-title">MOST RECENT ROLL:</div>
    <div class="result-panel" id="result"></div>
  </section>

  <div id="warning" class="warning">
    If these colors do not agree with what you saw on a livestream, then the results were rigged.
  </div>


  <a class="back" href="https://offline-dice.de" target="_blank" rel="noopener">← BACK TO DICE ROLLER</a>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUT0t1I9Dkee5Ok_uYMzs4WfdwapOA5As",
  authDomain: "kenzy-dice.firebaseapp.com",
  projectId: "kenzy-dice",
  databaseURL: "https://kenzy-dice-default-rtdb.europe-west1.firebasedatabase.app",
  storageBucket: "kenzy-dice.firebasestorage.app",
  messagingSenderId: "578956722062",
  appId: "1:578956722062:web:5156f5737e51ef75246edf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const colorMap = {
  red:"#e53935",
  orange:"#fb8c00",
  gold:"#fdd835",
  yellow:"#fdd835",
  green:"#43a047",
  blue:"#1e88e5",
  purple:"#8e24aa"
};

const colorNames = {
  red:"🟥 Red",
  orange:"🟧 Orange",
  gold:"🟨 Yellow",
  yellow:"🟨 Yellow",
  green:"🟩 Green",
  blue:"🟦 Blue",
  purple:"🟪 Purple"
};

function showResult(colors){
  const result = document.getElementById("result");
  result.className = "result-panel";

  const dice = (colors || []).map((c,i) =>
    `<div class="die" style="background:${colorMap[c] || "#777"};animation-delay:${i * 0.1}s"></div>`
  ).join("");

  const list = (colors || []).map((c,i) =>
    `<div style="margin-top:7px">${i + 1}. ${colorNames[c] || c}</div>`
  ).join("");

  result.innerHTML =
    `<div class="status">✅ CODE VALID</div>
     <div class="dice-row">${dice}</div>
     <div style="margin-top:12px;font-weight:800">🎲 COLORS:</div>
     <div>${list}</div>`;
}

function showError(message){
  const result = document.getElementById("result");
  result.className = "result-panel error";
  result.innerHTML = `<div class="status">${message}</div>`;
}

window.verify = async function(){
  const btn = document.getElementById("verifyBtn");
  const input = document.getElementById("code");
  const code = input.value.trim().toUpperCase();

  btn.classList.add("loading");
  btn.textContent = "VERIFYING";

  if(!code){
    showError("❌ ENTER GAME ID");
    btn.classList.remove("loading");
    btn.textContent = "VERIFY";
    return;
  }

  try{
    // Same code format as the other Kenzy Verify page:
    // KZ-XXXXXX -> XXXX... is used as the Firebase key.
    const id = code.replace(/^KZ-/, "");
    const snap = await get(ref(db, "verifyCodes/" + id));

    if(!snap.exists()){
      showError("❌ INVALID CODE");
      return;
    }

    const data = snap.val();
    showResult(data.colors || []);
  }catch(error){
    console.error(error);
    showError("❌ FIREBASE ERROR");
  }finally{
    btn.classList.remove("loading");
    btn.textContent = "VERIFY";
  }
};

document.getElementById("code").addEventListener("keydown", e => {
  if(e.key === "Enter") verify();
});
</script>
</body>
</html>
