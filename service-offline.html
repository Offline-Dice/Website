<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b18">
<title>Service Offline | Offline Dice</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#18376c 0,transparent 48%),linear-gradient(145deg,#070b18,#101027 60%,#170e2c);color:#fff;font-family:Inter,Arial,sans-serif}.panel{position:relative;width:min(720px,100%);padding:clamp(30px,6vw,64px);overflow:hidden;text-align:center;border:1px solid rgba(130,174,255,.25);border-radius:28px;background:linear-gradient(145deg,rgba(20,37,71,.92),rgba(14,14,34,.96));box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 80px rgba(55,120,255,.13)}.orb{width:86px;height:86px;margin:0 auto 28px;display:grid;place-items:center;border:1px solid rgba(125,170,255,.4);border-radius:26px;background:linear-gradient(135deg,#2679db,#8052db);box-shadow:0 0 45px rgba(76,133,255,.3);font-size:38px}.eyebrow{color:#8fbaff;font-size:11px;font-weight:900;letter-spacing:.25em}.title{margin:15px 0 12px;font-size:clamp(42px,9vw,76px);font-weight:1000;letter-spacing:-.06em;line-height:.95}.title span{color:transparent;background:linear-gradient(90deg,#67d9ff,#b28bff);background-clip:text;-webkit-background-clip:text}.copy{max-width:480px;margin:0 auto;color:#aab8d2;font-size:16px;line-height:1.7}.line{width:80px;height:3px;margin:30px auto;background:linear-gradient(90deg,#50d9ff,#a16aff);border-radius:5px}.foot{color:#7186ad;font-size:10px;font-weight:800;letter-spacing:.2em}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .8s cubic-bezier(.2,.8,.2,1) both}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}}
</style>
</head>
<body><main class="panel"><div class="orb">⏸</div><div class="eyebrow">OFFLINE DICE • SERVICE STATUS</div><h1 class="title">SERVICE<br><span>OFFLINE</span></h1><p class="copy">The service is currently unavailable. Offline Dice is taking a break while we prepare what comes next. Please check back later.</p><div class="line"></div><div class="foot">THANK YOU FOR BEING PART OF OFFLINE DICE</div></main></body>
</html>
